<div class="login-wrapper">
  <div class="login-card">
    <!-- PANEL IZQUIERDO: MARCA NEXORA (ESTILO MODERNO) -->
    <div class="login-brand-panel">
      <div class="brand-top">
        <!-- ISOTIPO OFICIAL NEXORA OP 3 -->
        <svg class="nexora-logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Trazo Azul (Electric Blue) -->
          <path d="M 50 140 C 30 110, 40 60, 95 55 C 130 50, 155 75, 125 105 L 85 135" 
                stroke="#3478F6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Trazo Verde (Nexora Teal) -->
          <path d="M 150 60 C 170 90, 160 140, 105 145 C 70 150, 45 125, 75 95 L 115 65" 
                stroke="#22B8A5" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>NEXORA</h1>
        <p class="subtitle">SISTEMA POS & ERP</p>
      </div>

      <div class="brand-illustration">
        <p class="slogan-text">Más que un sistema.</p>
        <span class="version-text">v1.0 - Edición Panadería</span>
      </div>
    </div>

    <!-- PANEL DERECHO: FORMULARIO DE ACCESO -->
    <div class="login-form-panel">
      <div class="form-header">
        <h2>Bienvenido</h2>
        <p>Ingresa tus credenciales para operar la caja</p>
      </div>

      <form class="form-body" (submit)="onLogin($event)">
        <div class="input-group">
          <label for="usuario">Usuario / Código</label>
          <input id="usuario" type="text" placeholder="Ej. jorge" autofocus required />
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn-entrar">Iniciar Sesión</button>
      </form>

      <div class="login-footer">
        <span>NEXORA SYSTEMS</span>
        <span class="support-line">La Paz, Bolivia</span>
      </div>
    </div>
  </div>
</div>
